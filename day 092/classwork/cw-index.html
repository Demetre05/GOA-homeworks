<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form id="myFirstForm">
        <input type="text" name="firstName" placeholder="სახელი">
        <input type="text" name="lastName" placeholder="გვარი">
        <input type="email" name="userEmail" placeholder="ელ-ფოსტა">
        <button type="button" id="showInputsBtn">დაბეჭდე Input-ები</button>
    </form>

    <form id="userForm">
        <input type="text" name="name" placeholder="შეიყვანეთ სახელი" required>
        <input type="number" name="age" placeholder="შეიყვანეთ ასაკი" required>
        <button type="submit">გაგზავნა</button>
    </form>

    <script src="./cw-script.js"></script>
</body>
</html>
